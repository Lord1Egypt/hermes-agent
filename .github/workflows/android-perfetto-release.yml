name: Android release trace upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose measured source manifest is committed on this ref
        required: true
        type: string
      transport_release_id:
        description: Exact private draft release ID for hosted trace transport
        required: true
        type: string
      transport_asset_id:
        description: Exact closed trace ZIP asset ID in that draft
        required: true
        type: string
      transport_sha256:
        description: SHA-256 of the closed trace ZIP, verified again before upload
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: android-release-traces-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - name: Validate dispatch inputs
        id: dispatch
        env:
          TAG: ${{ inputs.tag }}
          TRANSPORT_RELEASE_ID: ${{ inputs.transport_release_id }}
          TRANSPORT_ASSET_ID: ${{ inputs.transport_asset_id }}
          TRANSPORT_SHA256: ${{ inputs.transport_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REPOSITORY" = adybag14-cyber/hermes-agent
          [[ "$TRANSPORT_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRANSPORT_ASSET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRANSPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify measured trace source
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          digest="$(python scripts/android_release_evidence.py source-identity --require-clean | sed -n 's/^sourceDigest=//p')"
          python scripts/android_perfetto_release_artifact.py verify-source \
            --tag "$TAG" --expected-source-digest "$digest" > "$RUNNER_TEMP/source.json"
          printf 'artifact_name=%s\n' "$(jq -er .artifact_name "$RUNNER_TEMP/source.json")" >> "$GITHUB_OUTPUT"

  upload:
    needs: preflight
    # GitHub returns403 for private draft assets with contents:read. This
    # permission exists ONLY on the fixed GitHub-hosted upload job. No caller
    # supplied runner label, self-hosted execution or checkout credential remains.
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out only trusted trace tooling and metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/android_perfetto_artifacts.py
            /scripts/android_perfetto_release_artifact.py
            /android/release-evidence/perfetto-artifacts/${{ inputs.tag }}/source.json
            /android/release-evidence/${{ inputs.tag }}/performance/*.json
      - name: Download and verify private draft transport on GitHub hosting
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TRANSPORT_RELEASE_ID: ${{ inputs.transport_release_id }}
          TRANSPORT_ASSET_ID: ${{ inputs.transport_asset_id }}
          TRANSPORT_SHA256: ${{ inputs.transport_sha256 }}
        run: |
          python3 scripts/android_perfetto_release_artifact.py download-transport \
            --tag "$TAG" --transport-release-id "$TRANSPORT_RELEASE_ID" \
            --transport-asset-id "$TRANSPORT_ASSET_ID" --transport-sha256 "$TRANSPORT_SHA256" \
            --expected-commit "$GITHUB_SHA" --trace-root "$RUNNER_TEMP/trace-input"

      - name: Hash the closed trace-only input before upload
        env:
          TAG: ${{ inputs.tag }}
          TRACE_ROOT: ${{ runner.temp }}/trace-input
        run: python3 scripts/android_perfetto_release_artifact.py verify-traces --tag "$TAG" --trace-root "$TRACE_ROOT"
      - name: Upload measured trace bytes
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: ${{ runner.temp }}/trace-input/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false

  verify-round-trip:
    needs: [preflight, upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the immutable artifact on an independent hosted runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/perfetto
          merge-multiple: true
          digest-mismatch: error
      - name: Rehash every downloaded trace
        env:
          TAG: ${{ inputs.tag }}
        run: python scripts/android_perfetto_release_artifact.py verify-traces --tag "$TAG" --trace-root "$RUNNER_TEMP/perfetto"
